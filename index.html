<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnos de maestros — Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-deep:   #0E6E6A;
    --teal:        #17968F;
    --aqua:        #4FD1C0;
    --sun:         #F6C445;
    --cream:       #FBFBF6;
    --ink:         #0B3634;
    --ink-soft:    #3E5E5C;
    --card-shadow: 0 10px 26px rgba(9,60,57,.14);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    min-height:100%;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.18), transparent 55%),
      linear-gradient(135deg, var(--teal-deep) 0%, var(--teal) 38%, var(--aqua) 72%, var(--sun) 100%);
    padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px));
  }
  .wrap{max-width:920px;margin:0 auto;}

  header.page{
    text-align:left;
    color:#fff;
    margin-bottom:28px;
  }
  header.page .eyebrow{
    font-weight:800;
    font-size:.82rem;
    letter-spacing:.02em;
    color:rgba(255,255,255,.85);
    margin:0 0 4px;
  }
  header.page h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(1.7rem,4.4vw,2.5rem);
    margin:0;
    line-height:1.05;
    text-shadow:0 2px 10px rgba(6,45,43,.18);
  }
  header.page p{
    margin:10px 0 0;
    max-width:60ch;
    color:rgba(255,255,255,.92);
    font-size:.98rem;
  }

  .week{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.28);
    border-radius:22px;
    padding:20px;
    margin-bottom:22px;
    backdrop-filter:blur(2px);
  }
  .week h2{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    color:#fff;
    font-size:clamp(1.25rem,3.4vw,1.7rem);
    margin:2px 6px 16px;
    text-shadow:0 2px 8px rgba(6,45,43,.2);
  }

  .cols-head{
    display:grid;
    grid-template-columns:96px 1fr 1fr;
    gap:12px;
    padding:0 4px;
    margin-bottom:8px;
  }
  .cols-head span{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    color:#fff;
    font-size:.95rem;
  }
  .cols-head .grandes{grid-column:2;}
  .cols-head .peques{grid-column:3;}

  .turno{
    display:grid;
    grid-template-columns:96px 1fr 1fr;
    gap:12px;
    align-items:stretch;
    margin-bottom:10px;
  }
  .turno:last-child{margin-bottom:0;}

  .turno-label{
    display:flex;
    align-items:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    color:#fff;
    font-size:1.02rem;
  }

  .card{
    background:var(--cream);
    border-radius:14px;
    box-shadow:var(--card-shadow);
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    gap:10px;
    text-align:center;
  }
  .card .slot{display:flex;flex-direction:column;gap:2px;}
  .card .role{
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--ink-soft);
  }
  .card .name{
    font-weight:800;
    color:var(--teal-deep);
    font-size:1rem;
    line-height:1.15;
  }
  .card .divider{width:1px;align-self:stretch;background:#E3EFEE;}

  .peques-card{justify-content:center;}

  .estado{
    margin:6px;
    color:#fff;
    font-size:.95rem;
    line-height:1.45;
  }

  footer{
    text-align:center;
    color:rgba(255,255,255,.85);
    font-size:.82rem;
    margin-top:8px;
  }
  footer code, footer a{color:#fff;font-weight:700;}
  footer a{text-decoration:underline;}

  @media (max-width:560px){
    .cols-head, .turno{grid-template-columns:64px 1fr 1fr;}
    .turno-label{font-size:.9rem;}
    .card{flex-direction:column;gap:6px;padding:10px 8px;}
    .card .divider{display:none;}
    .card .name{font-size:.92rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <p class="eyebrow">Kids — El Refugio</p>
    <h1>Turnos de maestros</h1>
    <p>Cronograma de seños por semana, franja horaria y grupo de edad.</p>
  </header>

  <div id="schedule"></div>
  <footer>Para agregar o cambiar turnos, editá <a href="data.json"><code>data.json</code></a> y recargá la página. Solo se muestran las semanas desde hoy en adelante.</footer>
</div>

<script>
// Los turnos viven en data.json. Para sumar o cambiar una semana, editá ese
// archivo: esta página se genera sola al cargar.
const DATA_URL = 'data.json';

const root = document.getElementById('schedule');

const esc = txt => String(txt ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// "2026-09-27" se parsea como UTC si se pasa tal cual, lo que corre un día el
// filtro en horarios negativos (ej. Argentina). Con T00:00:00 es hora local.
function aFechaLocal(iso){
  const d = new Date(`${iso}T00:00:00`);
  return Number.isNaN(d.getTime()) ? null : d;
}

function hoyLocal(){
  const ahora = new Date();
  return new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
}

function tituloSemana(sem){
  if (typeof sem.titulo === 'string' && sem.titulo.trim()) return esc(sem.titulo);
  const d = aFechaLocal(sem.fecha);
  if (!d) return esc(sem.fecha);
  const txt = d.toLocaleDateString('es-AR', {
    weekday: 'long', day: 'numeric', month: 'long'
  });
  return esc(txt.charAt(0).toUpperCase() + txt.slice(1));
}

// Un mismo renderer para Grandes y Peques: si el grupo trae "ayudantes", se
// muestra la columna de ayuda; si no, queda solo el seño.
function grupoCard(grupo, clase){
  if (!grupo || !grupo.seño) return '';
  const ayuda = (grupo.ayudantes && String(grupo.ayudantes).trim())
    ? `<div class="divider"></div>
       <div class="slot"><span class="role">AYUDA</span><span class="name">${esc(grupo.ayudantes)}</span></div>`
    : '';
  return `<div class="card ${clase}">
      <div class="slot"><span class="role">SEÑO</span><span class="name">${esc(grupo.seño)}</span></div>
      ${ayuda}
    </div>`;
}

function semanaHTML(sem){
  return `
  <section class="week">
    <h2>${tituloSemana(sem)}</h2>
    <div class="cols-head">
      <span></span>
      <span class="grandes">Grandes (7 a 12 años)</span>
      <span class="peques">Peques (4 a 6/7 años)</span>
    </div>
    ${(sem.turnos || []).map(t => `
      <div class="turno">
        <div class="turno-label">${esc(t.turno)}</div>
        ${grupoCard(t.grandes, 'grandes-card')}
        ${grupoCard(t.peques, 'peques-card')}
      </div>
    `).join('')}
  </section>
`;
}

function estadoHTML(titulo, detalle){
  return `
  <section class="week">
    <h2>${esc(titulo)}</h2>
    <p class="estado">${detalle}</p>
  </section>
`;
}

function render(data){
  const hoy = hoyLocal();
  const semanas = (data && Array.isArray(data.semanas)) ? data.semanas : [];

  const futuras = semanas
    .map(sem => ({ sem, fecha: aFechaLocal(sem && sem.fecha) }))
    .filter(item => item.fecha && item.fecha.getTime() >= hoy.getTime())
    .sort((a, b) => a.fecha - b.fecha)
    .map(item => item.sem);

  if (futuras.length === 0){
    root.innerHTML = estadoHTML(
      'Sin turnos programados',
      `No hay semanas cargadas con fecha igual o posterior a hoy (${esc(hoy.toLocaleDateString('es-AR'))}).`
    );
    return;
  }
  root.innerHTML = futuras.map(semanaHTML).join('');
}

async function cargar(){
  root.innerHTML = estadoHTML('Cargando…', 'Buscando los turnos de la semana.');
  try {
    // no-store para que los cambios en data.json se vean al recargar la página.
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
  } catch (err) {
    root.innerHTML = estadoHTML(
      'No se pudieron cargar los turnos',
      `No se pudo leer <code>${esc(DATA_URL)}</code>. Verificá que el archivo exista y esté junto al <code>index.html</code>.`
    );
    console.error(err);
  }
}

cargar();
</script>
</body>
</html>
